
<button type="button" class="seat" [class.seat--selected]="selected" [class.seat--occupied]="occupied"
    [disabled]="occupied" [attr.aria-label]="label" [attr.aria-pressed]="selected" (click)="handleseatbooking()">
  <i class="material-icons" aria-hidden="true">airline_seat_recline_extra</i>
  <span>{{ seatno }}</span>
</button>
