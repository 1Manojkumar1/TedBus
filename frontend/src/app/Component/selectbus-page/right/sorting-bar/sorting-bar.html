<div class="sorting-wrapper">
  <div class="security-badge">
    <i class="fa-solid fa-shield-halved text-[#5f4299]"></i>
    <span>All TedBus operators undergo safety & hygiene verification</span>
  </div>

  <div class="sorting-bar">
    <div class="sort-label-group">
      <span class="sort-title">{{ 'NAV.BUS_TICKETS' | translate }}</span>
      <span class="sort-by">{{ 'BUS.SORT_BY' | translate }}</span>
    </div>

    <div class="sort-chips">
      <button type="button" class="sort-chip" [class.active]="isActive('departure')" (click)="sort('departure')">
        <span>{{ 'BUS.DEPARTURE' | translate }}</span>
        <span class="dir-icon">{{ direction('departure') }}</span>
      </button>
      <button type="button" class="sort-chip" [class.active]="isActive('duration')" (click)="sort('duration')">
        <span>{{ 'BUS.DURATION' | translate }}</span>
        <span class="dir-icon">{{ direction('duration') }}</span>
      </button>
      <button type="button" class="sort-chip" [class.active]="isActive('arrival')" (click)="sort('arrival')">
        <span>{{ 'BUS.ARRIVAL' | translate }}</span>
        <span class="dir-icon">{{ direction('arrival') }}</span>
      </button>
      <button type="button" class="sort-chip" [class.active]="isActive('rating')" (click)="sort('rating')">
        <span>{{ 'BUS.RATINGS' | translate }}</span>
        <span class="dir-icon">{{ direction('rating') }}</span>
      </button>
      <button type="button" class="sort-chip" [class.active]="isActive('fare')" (click)="sort('fare')">
        <span>{{ 'BUS.FARE' | translate }}</span>
        <span class="dir-icon">{{ direction('fare') }}</span>
      </button>
      <button type="button" class="sort-chip" [class.active]="isActive('seats')" (click)="sort('seats')">
        <span>{{ 'BUS.SEATS' | translate }}</span>
        <span class="dir-icon">{{ direction('seats') }}</span>
      </button>
    </div>
  </div>
</div>
