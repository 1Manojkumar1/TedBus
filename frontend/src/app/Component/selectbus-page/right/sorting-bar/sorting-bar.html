<div class="security-container">
  <mat-icon style="font-size: 20px; padding-bottom: 10px;">security</mat-icon>
  <div>All bus ratings include safety as a major factor</div>
</div>
<mat-divider></mat-divider>
<div class="main-container">
  <div class="main-container1">
    <div>BUSES LIST</div>
    <div>SORT BY :</div>
  </div>
  <div class="main-container2" [class.active]="isActive('departure')" (click)="sort('departure')">Departure {{ direction('departure') }}</div>
  <div class="main-container3" [class.active]="isActive('duration')" (click)="sort('duration')">Duration {{ direction('duration') }}</div>
  <div class="main-container4" [class.active]="isActive('arrival')" (click)="sort('arrival')">Arrivals {{ direction('arrival') }}</div>
  <div class="main-container5" [class.active]="isActive('rating')" (click)="sort('rating')">Ratings {{ direction('rating') }}</div>
  <div class="main-container6" [class.active]="isActive('fare')" (click)="sort('fare')">Fare {{ direction('fare') }}</div>
  <div class="main-container7" [class.active]="isActive('seats')" (click)="sort('seats')">Seats Available {{ direction('seats') }}</div>
</div>
