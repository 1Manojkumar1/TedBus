<app-header></app-header>

<!-- Mobile Floating "Filter & Sort" Trigger Pill -->
<div class="fixed bottom-20 left-1/2 -translate-x-1/2 z-30 md:hidden">
  <button type="button" (click)="isMobileFilterOpen.set(true)"
    class="flex items-center gap-2.5 px-5 py-3 rounded-full bg-[#5f4299] text-white font-extrabold text-xs shadow-2xl hover:bg-[#4d347c] transition-transform active:scale-95 border border-purple-400/30 cursor-pointer backdrop-blur-md">
    <i class="fa-solid fa-sliders text-sm"></i>
    <span>{{ 'FILTER.TITLE' | translate }}</span>
    <span *ngIf="activeFiltersCount() > 0"
      class="w-5 h-5 rounded-full bg-[#d84e55] text-white text-[10px] font-extrabold flex items-center justify-center animate-pulse">
      {{ activeFiltersCount() }}
    </span>
  </button>
</div>

<!-- Mobile Filter Bottom Sheet Modal -->
<div *ngIf="isMobileFilterOpen()"
  class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center p-0 md:hidden animate-fade-in">
  <div class="w-full bg-white dark:bg-slate-900 border-t border-gray-200 dark:border-slate-800 rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
    <!-- Sheet Drag Handle & Header -->
    <div class="p-4 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between relative">
      <div class="w-12 h-1 bg-gray-300 dark:bg-slate-700 rounded-full mx-auto absolute left-1/2 -translate-x-1/2 top-2"></div>
      <div class="flex items-center gap-2 pt-2">
        <i class="fa-solid fa-sliders text-[#5f4299]"></i>
        <h3 class="font-extrabold text-base text-gray-900 dark:text-gray-100">{{ 'FILTER.TITLE' | translate }}</h3>
        <span *ngIf="activeFiltersCount() > 0" class="text-xs text-purple-600 font-bold">({{ activeFiltersCount() }} active)</span>
      </div>
      <button type="button" (click)="isMobileFilterOpen.set(false)"
        class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-400 hover:text-gray-700 flex items-center justify-center text-lg">
        ✕
      </button>
    </div>

    <!-- Sheet Content -->
    <div class="flex-1 overflow-y-auto p-4">
      <app-left></app-left>
    </div>

    <!-- Sheet Footer -->
    <div class="p-4 border-t border-gray-100 dark:border-slate-800 flex items-center gap-3 bg-gray-50 dark:bg-slate-800/50">
      <button *ngIf="activeFiltersCount() > 0" type="button" (click)="filters.reset()"
        class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-slate-700 text-xs font-bold text-gray-700 dark:text-gray-300">
        {{ 'BUS.RESET_FILTERS' | translate }}
      </button>
      <button type="button" (click)="isMobileFilterOpen.set(false)"
        class="flex-1 py-2.5 rounded-xl bg-[#5f4299] text-white text-xs font-bold shadow-md">
        {{ 'COMMON.CONFIRM' | translate }}
      </button>
    </div>
  </div>
</div>

<div class="selectbus-container">
  <div class="hidden md:block">
    <app-left></app-left>
  </div>
  <app-right></app-right>
</div>
